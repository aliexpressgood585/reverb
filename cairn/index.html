<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
<title>CAIRN</title>
<meta name="description" content="Every death leaves a stone. Climb on what you were." />
<meta name="theme-color" content="#05070a" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305070a'/%3E%3Crect x='12' y='6' width='8' height='6' fill='%23DCE3E8'/%3E%3Crect x='9' y='14' width='14' height='5' fill='%236E7A84'/%3E%3Crect x='6' y='21' width='20' height='5' fill='%236E7A84'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<canvas id="view"></canvas>

<!-- The only permanent interface: how high you have ever been, and how many of
     you it took. Two numbers, no boxes, no bars. -->
<div id="hud">
  <p id="height">0<i>m</i></p>
  <p id="toll"></p>
</div>

<!-- The first-run teacher. Three lines, each one appears only when the player
     has earned it, and never comes back. -->
<p id="teach"></p>

<div id="start">
  <h1>CAIRN</h1>
  <p class="tag">EVERY DEATH LEAVES A STONE</p>
  <p class="go">TOUCH TO BEGIN</p>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
