<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- `user-scalable=no` STAYS, and it is the only Lighthouse accessibility
     failure on this page (86 instead of 100).
     Removing it is tempting and was tried: a climbing game is one long drag, and
     acceptance test 9 — which this project wrote after shipping a build that
     could not be started — asserts the lockdown directly. Lighthouse's audit is
     written for documents, and this page has no scrollable text to magnify; the
     interface is a canvas and one number. Trading a measured gesture guarantee
     for a generic score would be weakening a gate to buy a number.
     Recorded in AUDIT.md rather than silently accepted. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>CAIRN</title>
<meta name="description" content="Every death leaves a stone. Climb on what you were." />
<meta name="theme-color" content="#04060B" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CAIRN" />
<!-- The mark, inline, so the browser never asks for /favicon.ico and never gets
     a 404. Deferring the PNG icons to idle (see main.js) is right for boot cost
     and left exactly this gap for one frame. An SVG data URI costs no encode and
     no request, and it is still zero external assets. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2305070C'/%3E%3Crect x='24' y='14' width='16' height='9' rx='1' fill='%23E8EFF3'/%3E%3Crect x='18' y='27' width='28' height='9' rx='1' fill='%23C99A4A'/%3E%3Crect x='12' y='40' width='40' height='9' rx='1' fill='%234A5B6B'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./style.css" />
<script>
/* Self-heal, first thing on the page and outside the module bundle so it runs
   even if the bundle itself is the stale thing. An earlier build registered a
   cache-first service worker that can pin a device to a dead deploy; this
   unregisters every worker, purges every cache, and reloads once — but only if
   a worker was actually controlling this page, so a clean device pays nothing. */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.getRegistrations().then(function (rs) {
    return Promise.all(rs.map(function (r) { return r.unregister(); }));
  }).then(function () {
    if (!window.caches) return null;
    return caches.keys().then(function (ks) {
      return Promise.all(ks.map(function (k) { return caches.delete(k); }));
    });
  }).then(function () {
    if (had && !sessionStorage.getItem('cairn.healed')) {
      sessionStorage.setItem('cairn.healed', '1');
      location.reload();
    }
  }).catch(function () {});
})();
</script>
</head>
<body>
<canvas id="view"></canvas>

<!-- The entire interface. One number, one card, two corners, one panel. -->
<p id="height"></p>
<div id="card"></div>
<p id="toast"></p>
<div id="best"></div>
<p id="streak"></p>
<button id="monshare" type="button"></button>
<button id="daily" class="corner" type="button"></button>
<button id="menu" class="corner" type="button">≡</button>
<div id="panel"></div>
<pre id="debug"></pre>

<!-- The error boundary. A game that throws before the loop starts must say so,
     not present a black rectangle. Filled in by main.js; inert until then. -->
<div id="fatal"><p></p></div>

<script type="module" src="./main.js"></script>
</body>
</html>
